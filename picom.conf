# ============================================================
# Picom - configuração simples para XFCE + NVIDIA
# ============================================================

# Renderização via OpenGL
backend = "glx";

# Sincronização vertical
vsync = true;

# Importante para sincronização com drivers NVIDIA
xrender-sync-fence = true;

# Redesenhar somente regiões alteradas
use-damage = true;

# ------------------------------------------------------------
# Cantos
# ------------------------------------------------------------

corner-radius = 8;

# ------------------------------------------------------------
# Sombras
# ------------------------------------------------------------

shadow = true;
shadow-radius = 8;
shadow-opacity = 0.18;
shadow-offset-x = -4;
shadow-offset-y = -4;

# ------------------------------------------------------------
# Transparência
# ------------------------------------------------------------

# Nesta primeira fase NÃO aplicaremos transparência global.
# Primeiro vamos comprovar estabilidade.

detect-client-opacity = true;

# ------------------------------------------------------------
# Efeitos
# ------------------------------------------------------------

fading = false;

#fade-in-step = 0.05;
#fade-out-step = 0.04;
#fade-delta = 15;

# Não usar blur
blur-background = true;

# Não fazer unredirect inicialmente.
# Priorizamos previsibilidade com NVIDIA.
unredir-if-possible = false;

# Transparência leve em janelas inativas
inactive-opacity = 0.97;
active-opacity = 1.0;
inactive-opacity-override = false;

# ============================================================
# Exceções opcionais - Sticky Notes / GTK CSD / Flatpak
# ============================================================
#
# IMPORTANTE:
# Este bloco é específico para o aplicativo Flatpak Sticky Notes,
# identificado no X11 como "com.vixalien.sticky".
# Ele permanece INTEIRAMENTE COMENTADO e, portanto, INATIVO por padrão.
# Não deve ser tratado como uma regra genérica para aplicativos Flatpak.
#
# No ambiente validado, essas exceções eliminaram artefatos gráficos do
# Sticky Notes causados pela interação entre Picom e a janela GTK/CSD/ARGB.
# Para usar somente nesse aplicativo, descomente manualmente o bloco abaixo.
#
# O Sticky Notes possui decoração própria GTK e margens ARGB.
# Não adicionar uma segunda sombra pelo Picom.
# shadow-exclude = [
#     "class_g = 'com.vixalien.sticky'"
# ];
#
# Deixar o GTK controlar os próprios cantos dessa aplicação.
# rounded-corners-exclude = [
#     "class_g = 'com.vixalien.sticky'"
# ];
#
# Não aplicar blur nas superfícies transparentes/CSD dessa aplicação.
# blur-background-exclude = [
#     "class_g = 'com.vixalien.sticky'"
# ];
#
# Considerar as janelas do Sticky Notes sempre focadas para efeitos
# de opacidade do Picom. A opacidade própria do aplicativo continua
# podendo ser detectada por detect-client-opacity.
# focus-exclude = [
#     "class_g = 'com.vixalien.sticky'"
# ];
